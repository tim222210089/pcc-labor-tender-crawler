name: PCC cloud network probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public PCC HTTPS
        shell: python
        run: |
          import socket, urllib.request
          print(socket.getaddrinfo('web.pcc.gov.tw', 443, type=socket.SOCK_STREAM))
          with urllib.request.urlopen('https://web.pcc.gov.tw/', timeout=15) as r:
              print('pcc_http_status=', r.status)
              print('pcc_body_bytes=', len(r.read(1024)))
