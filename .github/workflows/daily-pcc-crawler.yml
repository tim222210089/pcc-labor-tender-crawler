name: PCC actual query network probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual query without redirect
        shell: python
        run: |
          import urllib.request, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          url = 'https://web.pcc.gov.tw/prkms/tender/common/advanced/readTenderAdvanced?' + urllib.parse.urlencode({'tenderType':'TENDER_DECLARATION','tenderWay':'TENDER_WAY_ALL_DECLARATION','dateType':'isNow','firstSearch':'true','searchType':'advanced','pageSize':'100'})
          with urllib.request.build_opener(NoRedirect).open(url, timeout=25) as response:
              print('query status:', response.status, 'bytes:', len(response.read()))